
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelLog - Cyber SOC Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&family=Orbitron:wght@400;700&display=swap');
      
      :root {
        --neon-green: #10b981;
        --neon-blue: #6366f1;
        --cyber-bg: #050507;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--cyber-bg);
        color: #e2e8f0;
        margin: 0;
        overflow: hidden;
      }

      .cyber-font {
        font-family: 'Orbitron', sans-serif;
      }

      .mono {
        font-family: 'Fira Code', monospace;
      }

      /* Animated Grid Background */
      .bg-grid {
        background-size: 50px 50px;
        background-image: 
          linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
        position: fixed;
        inset: 0;
        z-index: -1;
      }

      .bg-gradient-radial {
        background: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
        position: fixed;
        inset: 0;
        z-index: -1;
      }

      /* Scanline Effect */
      .scanline {
        width: 100%;
        height: 100px;
        z-index: 100;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(16, 185, 129, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
        opacity: 0.1;
        position: absolute;
        bottom: 100%;
        animation: scanline 8s linear infinite;
        pointer-events: none;
      }

      @keyframes scanline {
        0% { bottom: 100%; }
        100% { bottom: -100px; }
      }

      /* Glitch Animation */
      .glitch:hover {
        animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
      }

      @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }

      .neon-border {
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.2), inset 0 0 5px rgba(16, 185, 129, 0.1);
      }

      .card-glow:hover {
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        border-color: rgba(99, 102, 241, 0.4);
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f1115;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--neon-green);
      }
    </style>
<script type="importmap">
{

</head>
<body>
    <div class="bg-grid"></div>

    <div id="root"></div>

</html>
